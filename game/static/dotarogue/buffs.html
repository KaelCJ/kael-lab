      <section class="catalog-card">
        <h2>当前永久增益</h2>
        <p>Buff可重复购买并按层数叠加，不占装备格。白色普通、蓝色稀有、紫色史诗、橙色传说为固定品质，购买层数不提升品质。启用 JavaScript 后可查看完整效果、价格与触发条件。</p>
        <p>弹无虚发、树枝、耐久光环、热血战魂、龙族血统、奥术光环、强袭光环、冰心、星环装置、机械护卫、祭品、薄葬、活体护甲、奔腾、血怒、贪魔的贪婪、恩赐解脱、牺牲、疯狂面具、臂章、集中火力、风行、神之力量、嗜血术、狂战士之血、霜冻护甲、反击螺旋。</p>
        <p>薄葬按购买层数提供每波抵挡次数；臂章在战斗中每层每秒流失1生命，最低保留1。暂停冻结这些对局计时，不重新补充薄葬。</p>
        <h2>野区限时增益</h2>
        <ul>
          <li>红Buff：在DotA经典战场击杀红Buff野怪获得，持续75秒。普攻灼烧3秒，每秒造成6＋攻击力12%的伤害并减速20%；重复命中刷新，不叠加。</li>
          <li>蓝Buff：在DotA经典战场击杀蓝Buff野怪获得，持续75秒。每秒额外回复4法力；技能与法术装备冷却缩减＋15个百分点，总上限60%。</li>
          <li>肉山之力：在DotA经典战场击杀肉山获得，持续120秒，所有伤害提高20%；击杀时恢复全部生命与法力，并获得200材料和3个待开奖励箱。</li>
        </ul>
        <p>限时增益只消耗战斗时间，暂停与波间菜单冻结倒计时。再次获得同种增益时，从当前时刻重新计满持续时间，不叠加效果或累加剩余时间；不同种增益可同时持有。</p>
