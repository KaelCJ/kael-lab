        <ul>
          <li>矮人火枪手：远程点杀；主动散弹齐射，被动增程瞄准。</li>
          <li>刚背兽：近战反击；主动刚毛齐射，被动刚背。</li>
          <li>众神之王：静电与落雷；主动全场雷击，被动静电场。</li>
          <li>炼金术士：经济与狂暴；主动化学狂暴，被动炼金分红。</li>
          <li>剑圣：跳斩与旋转；主动剑刃风暴，被动随等级进化的跃空斩。</li>
          <li>影魔：收魂成长；主动魂之挽歌，被动收魂。</li>
          <li>召唤师：随机法术；主动回响施法，被动万象轮转。当前法术为混沌之风、电磁脉冲、混沌陨石、寒冰之墙、炽魂召唤与震荡波。</li>
          <li>月之骑士：月光与弹射；主动月蚀，被动月刃弹射。</li>
          <li>灵魂守卫：变身与魔影；主动恶魔变身，被动魔影。</li>
        </ul>
        <p>技能按英雄 Lv.1～4、Lv.5～9、Lv.10+ 分为三阶，伤害／主动增益倍率为 1、1.25、1.5。英雄等级与装备强化等级分开计算。</p>
