      <section class="catalog-card">
        <h2>敌潮中的怪物</h2>
        <p>当前有 14 类基础敌人、旧战场肉山首领变体，以及经典战场的 3 个固定中立目标。开启 JavaScript 后可按名称检索并查看基础生命、接触伤害、移动速度、材料价值和当前招式。</p>
        <h3>普通敌人</h3>
        <p>爬行机与追猎虫追击玩家，铁甲兽以高生命施压；孢射体发射远程弹丸，冲锋残骸锁定方向后冲锋，分裂菌团死亡后产生小追猎虫。</p>
        <h3>七类精英</h3>
        <p>半人马可汗、萨特苦难使者、地狱熊怪粉碎者、黑暗巨魔召唤师、精英哨卫、霜冻幽魂、雷霆蜥蜴依次在第 3／5／7／9／12／15／18 波出现，分别提供踩踏、直线弹道、砸地、召唤、冲锋、延迟霜爆和三叉雷击。</p>
        <h3>首领</h3>
        <p>远古暴君在所有战场第 10 波及无尽模式第 30 波起的首领波出现。旧三张战场第 20 波保留基础生命1680的肉山变体，生命低于55%后暴怒；经典图第20波改为原巢穴的同一个固定肉山回满生命并觉醒。</p>
        <h3>固定中立目标 · 仅经典战场</h3>
        <p>红 Buff 守卫基础生命340、重击伤害11、速度90，蓝 Buff 守卫基础生命380、重击伤害12、速度84。两者在营地小范围巡逻，活动半径270，脱离后回巢回血、清除控制；死亡后90秒重生。击杀各得18材料、12经验和75秒对应增益：红 Buff 令普攻灼烧与减速，蓝 Buff 增加回蓝与冷却缩减。</p>
        <p>固定巢穴肉山基础生命14,000、重击伤害95、速度105、活动半径360；半血暴怒，砸地并发射三枚巨石，死亡后180秒重生。击杀得60经验、200材料、3个待开奖励箱，回满生命／法力，并获得120秒所有伤害提高20%的肉山之力。营地生命跨波保留，每次击杀后重生生命提高25%；暂停、商店和波间冻结重生与增益计时。</p>
