<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" shape-rendering="crispEdges">
  <title>星核幸存者：赤沙废港</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081c2a"/>
      <stop offset="0.62" stop-color="#153545"/>
      <stop offset="1" stop-color="#762f36"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c66e4d"/>
      <stop offset="1" stop-color="#5c2932"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a38" stop-opacity=".94"/>
      <stop offset="1" stop-color="#071923" stop-opacity=".84"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="4" dy="4" result="offset"/>
      <feFlood flood-color="#061018" flood-opacity=".9"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#sky)"/>
  <path d="M0 182h800v4H0zM0 244h800v2H0z" fill="#8be4bd" opacity=".12"/>

  <!-- Pixel stars and distant port lights -->
  <g fill="#d9fff0">
    <path d="M48 42h4v4h-4zM121 77h3v3h-3zM214 35h4v4h-4zM306 91h3v3h-3zM385 50h4v4h-4zM487 82h3v3h-3zM595 39h4v4h-4zM716 76h3v3h-3z" opacity=".75"/>
    <path d="M89 126h7v3h-7zM264 139h6v3h-6zM526 125h8v3h-8zM676 145h7v3h-7z" fill="#ffd178" opacity=".75"/>
  </g>
  <g fill="#4f9a93" opacity=".65">
    <path d="M0 214h92v-22h6v22h36v-42h6v42h52v-28h8v28h48v-58h8v58h71v-24h7v24h65v-37h7v37h75v-16h8v16h70v-31h7v31h97v-22h8v22h74v-10h8v10h42v46H0z"/>
  </g>

  <!-- Red sand dock and river -->
  <path d="M0 226h800v174H0z" fill="url(#sand)"/>
  <path d="M0 306c94-26 152-24 233 7s136 27 211-8 124-41 194-11 105 35 162 11v95H0z" fill="#3b2834" opacity=".78"/>
  <path d="M470 400c20-47 58-72 102-78 31-4 61 4 93 17 34 14 75 14 135-5v66z" fill="#235b67"/>
  <path d="M482 400c22-35 55-51 89-53 34-2 57 10 87 19 44 14 82 9 142-9v43z" fill="#348995" opacity=".9"/>
  <g fill="#74c7b2" opacity=".85">
    <path d="M520 377h38v3h-38zM589 358h52v3h-52zM658 383h42v3h-42zM720 365h29v3h-29z"/>
  </g>

  <!-- Pixel ruins -->
  <g fill="#223744" stroke="#75b3a6" stroke-width="2">
    <path d="M25 261h46v-35h11v35h43v68H25z"/>
    <path d="M690 229h44v-27h12v27h29v79h-85z"/>
  </g>
  <g fill="#e5a15e" opacity=".75">
    <path d="M37 244h9v8h-9zM58 244h9v8h-9zM710 243h10v8h-10zM733 243h10v8h-10zM706 266h18v5h-18z"/>
  </g>

  <!-- Hero/boss silhouettes built into the banner for a readable small preview -->
  <g transform="translate(430 232) scale(3.2)" filter="url(#shadow)">
    <circle cx="16" cy="8" r="5" fill="#ffd178"/>
    <path d="M8 16h16v20H8z" fill="#4ec6b9" stroke="#10252d" stroke-width="2"/>
    <path d="M4 21h6v7H4zM22 21h6v7h-6z" fill="#7ce5cf" stroke="#10252d" stroke-width="2"/>
    <path d="M11 36h5v7h-5zM18 36h5v7h-5z" fill="#e6a15e" stroke="#10252d" stroke-width="2"/>
    <path d="M28 15l8 5-8 5z" fill="#ffd178" stroke="#10252d" stroke-width="2"/>
  </g>
  <g transform="translate(650 247) scale(2.9)" filter="url(#shadow)">
    <path d="M6 9h29v27H6z" fill="#a75b55" stroke="#10252d" stroke-width="2"/>
    <path d="M12 3h17v9H12z" fill="#d98757" stroke="#10252d" stroke-width="2"/>
    <path d="M1 17h8v8H1zM32 17h8v8h-8z" fill="#d98757" stroke="#10252d" stroke-width="2"/>
    <path d="M12 18h6v6h-6zM23 18h6v6h-6z" fill="#75e1c6"/>
    <path d="M10 36h8v5h-8zM24 36h8v5h-8z" fill="#552e3a"/>
  </g>

  <!-- Readable mobile-first title panel -->
  <rect x="28" y="26" width="350" height="148" rx="4" fill="url(#panel)" stroke="#75c5b2" stroke-width="2"/>
  <path d="M28 61h350" stroke="#ffd178" stroke-width="3"/>
  <text x="50" y="52" fill="#8be4bd" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" letter-spacing="3">KAEL LAB · BROWSER GAME</text>
  <text x="49" y="111" fill="#f4f5e9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="900">星核</text>
  <text x="166" y="111" fill="#ffd178" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="900">幸存者</text>
  <text x="52" y="143" fill="#d5e8df" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15">在赤沙废港活过 20 波，或进入无尽模式。</text>
  <text x="52" y="162" fill="#8be4bd" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" letter-spacing="2">SURVIVE · UPGRADE · RETURN</text>

  <rect x="28" y="352" width="744" height="2" fill="#ffd178" opacity=".7"/>
  <text x="30" y="379" fill="#e4f4ea" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13">原创网页生存肉鸽 · 桌面与手机均可游玩</text>
  <text x="770" y="379" text-anchor="end" fill="#8be4bd" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13">KAEL LAB</text>
</svg>
